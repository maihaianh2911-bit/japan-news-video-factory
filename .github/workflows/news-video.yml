name: Japan News Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'story: kịch bản trong stories/ · daily: tin mới · demo: video mẫu · source: thông cáo theo URL'
        type: choice
        options: [story, daily, demo, source]
        default: story
      story:
        description: 'Tên file trong stories/ (không có .json), cho chế độ story'
        type: string
      source_url:
        description: 'Link thông cáo HTML của BOJ, METI hoặc trang CPI toàn quốc'
        type: string
  push:
    branches: [main]
    paths:
      - 'news/**'
      - 'stories/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/news-video.yml'

permissions:
  contents: write

concurrency:
  group: japan-news-video-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Choose what to make
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          STORY: ${{ inputs.story }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pushed story file is made at once; a push of code only renders the demo as a check.
          if [[ "$EVENT_NAME" == "push" ]]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE=HEAD~1
            STORY=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'stories/*.json' | head -n 1)
            STORY=${STORY#stories/}; STORY=${STORY%.json}
            MODE=demo; [[ -n "$STORY" ]] && MODE=story
          fi
          STAGE=
          if [[ "$MODE" == "story" ]]; then
            [[ "$STORY" =~ ^[A-Za-z0-9._-]+$ && -f "stories/$STORY.json" ]] || { echo "::error::stories/$STORY.json not found"; exit 1; }
            STAGE=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('stage', 'find'))" "stories/$STORY.json")
            [[ "$STAGE" == "find" || "$STAGE" == "render" ]] || { echo "::error::stage must be find or render"; exit 1; }
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "story=$STORY" >> "$GITHUB_OUTPUT"; echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE story=$STORY stage=$STAGE"
      - name: Install video dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Get the pictures already found for the story
        if: steps.plan.outputs.mode == 'story'
        env:
          STORY: ${{ steps.plan.outputs.story }}
        run: |
          mkdir -p pictures
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 "$URL" "+refs/heads/renders:refs/remotes/origin/renders"; then
            git archive origin/renders "$STORY/find" 2>/dev/null | tar -x --strip-components=2 -C pictures || true
          fi
          ls pictures | head -50
      - name: Find pictures
        if: steps.plan.outputs.stage == 'find'
        env:
          STORY: ${{ steps.plan.outputs.story }}
        run: |
          python -m news.find "stories/$STORY.json" pictures
          tools/publish.sh "$STORY/find" pictures
          echo "Đã tìm ảnh cho \`$STORY\`: nhánh renders, thư mục \`$STORY/find\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Start Japanese voice engine
        if: steps.plan.outputs.stage != 'find'
        run: |
          docker run --detach --name voicevox --publish 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 4 http://127.0.0.1:50021/version; then
              exit 0
            fi
            sleep 3
          done
          docker logs voicevox
          exit 1
      - name: Voice and render
        id: render
        if: steps.plan.outputs.stage != 'find'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          STORY: ${{ steps.plan.outputs.story }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          if [[ "$MODE" == "story" ]]; then
            python -m news --story "stories/$STORY.json" --pictures pictures
            python -m news --story "stories/$STORY.json" --pictures pictures --stills dist/stills
          elif [[ "$MODE" == "demo" ]]; then
            python -m news --demo
          elif [[ "$MODE" == "source" ]]; then
            : "${SOURCE_URL:?Enter an official release URL}"
            python -m news --url "$SOURCE_URL"
          else
            python -m news
          fi
      - name: Verify video and audio
        if: steps.render.outputs.ready == 'true'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate:format=duration -of json dist/video.mp4 > /tmp/japan-news-probe.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          probe = json.loads(Path('/tmp/japan-news-probe.json').read_text())
          video = next(stream for stream in probe['streams'] if stream['codec_type'] == 'video')
          audio = next(stream for stream in probe['streams'] if stream['codec_type'] == 'audio')
          assert (video['width'], video['height'], video['r_frame_rate'], video['codec_name']) == (1080, 1920, '30/1', 'h264')
          assert audio['codec_name'] == 'aac'
          limit = 600 if os.environ['MODE'] == 'story' else 91
          assert 10 < float(probe['format']['duration']) <= limit
          print(probe)
          PY
      - name: Publish the story video
        if: steps.render.outputs.ready == 'true' && steps.plan.outputs.mode == 'story'
        env:
          STORY: ${{ steps.plan.outputs.story }}
        run: |
          tools/publish.sh "$STORY" dist
          echo "Video: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/renders/$STORY/video.mp4" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the video and sources
        if: steps.render.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: japan-news-video-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
