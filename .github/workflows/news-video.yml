name: Japan News Video

# One issue "[Tin Nhật] …" = one video (like the owner's other channels). The owner opens the issue → Claude writes
# stories/<name>.json with "issue": N → this workflow finds pictures → Claude picks them → this workflow makes the
# voice and the video → Claude checks every scene → done. An owner comment → Claude fixes. Claude's side:
# AGENT_JNEWS.md. GitHub calls Claude after every step (secrets CLAUDE_TASK_URL / CLAUDE_TASK_TOKEN); no hourly run.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'story: kịch bản trong stories/ · daily: tin mới · demo: video mẫu · source: thông cáo theo URL'
        type: choice
        options: [story, daily, demo, source]
        default: story
      story:
        description: 'Tên file trong stories/ (không có .json), cho chế độ story'
        type: string
      source_url:
        description: 'Link thông cáo HTML của BOJ, METI hoặc trang CPI toàn quốc'
        type: string
  push:
    branches: [main]
    paths:
      - 'news/**'
      - 'stories/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/news-video.yml'

permissions:
  contents: write
  issues: write

# No concurrency group for the whole workflow: a group keeps only one pending run and cancels the others, which
# silently dropped the pushes of other stories. The video job has one group per story instead (below): two runs
# of the same story never work at the same time, and of several waiting runs only the newest is kept, which is
# the one with the newest story file. Different stories may overlap; tools/publish.sh rebuilds on the newest
# renders tip, so none is lost.

jobs:
  # 1) The owner opens a [Tin Nhật] issue → labels, a comment, and Claude is called to write the story
  start:
    if: >-
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[Tin Nhật]')
      && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read, issues: write }
    env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', N: '${{ github.event.issue.number }}' }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: tools }
      - name: Gắn nhãn
        run: gh issue edit "$N" --add-label jnews,jnews-plan
      - name: Gọi Claude
        id: wake
        env:
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          WAKE_COMMENT: 'no'   # the next step writes the one comment
        run: bash tools/wake_claude.sh "Phiếu tin Nhật mới số $N." "$N"
      - name: Nhận phiếu
        env:
          WAKE: ${{ steps.wake.outputs.wake }}
          NOTE: ${{ steps.wake.outputs.note }}
        run: |
          # promise the next steps only when Claude was really called (or is already on it in a chat: busy)
          if [[ "$WAKE" == ok || "$WAKE" == busy ]]; then
            gh issue comment "$N" --body "🤖 Đã nhận kịch bản. Claude sẽ dịch sát sang tiếng Nhật và chia cảnh, máy tìm ảnh, Claude chọn ảnh cho từng cảnh, máy tạo giọng và dựng video, Claude kiểm tra lại từng cảnh. Mỗi bước xong sẽ báo ở đây."
          else
            gh issue comment "$N" --body "🤖 Đã nhận kịch bản, nhưng Claude chưa bắt đầu làm. ${NOTE#🤖 }"
          fi

  # 2) The owner comments on a video issue → Claude reads it and fixes
  fix:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'open'
      && !github.event.issue.pull_request
      && contains(github.event.issue.labels.*.name, 'jnews')
      && github.event.comment.user.login == github.repository_owner
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read, issues: write }
    env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', N: '${{ github.event.issue.number }}' }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: tools }
      - name: Gắn nhãn
        run: |
          gh issue edit "$N" --add-label jnews-fix || true
          gh issue edit "$N" --remove-label jnews-done || true
      - name: Gọi Claude
        id: wake
        env:
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          WAKE_COMMENT: 'no'   # the next step writes the one comment
        run: bash tools/wake_claude.sh "Chủ kênh yêu cầu sửa phiếu tin Nhật số $N." "$N"
      - name: Nhận yêu cầu sửa
        env:
          WAKE: ${{ steps.wake.outputs.wake }}
          NOTE: ${{ steps.wake.outputs.note }}
        run: |
          if [[ "$WAKE" == ok || "$WAKE" == busy ]]; then
            gh issue comment "$N" --body "🤖 Đã nhận yêu cầu. Claude sẽ sửa và máy dựng lại."
          else
            gh issue comment "$N" --body "🤖 Đã nhận yêu cầu sửa, nhưng Claude chưa bắt đầu làm. ${NOTE#🤖 }"
          fi

  # 2b) The owner comments on a closed video issue → a short note instead of silence
  closed:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'closed'
      && !github.event.issue.pull_request
      && contains(github.event.issue.labels.*.name, 'jnews')
      && github.event.comment.user.login == github.repository_owner
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { issues: write }
    steps:
      - name: Báo phiếu đã đóng
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', N: '${{ github.event.issue.number }}' }
        run: |
          gh issue comment "$N" --body "🤖 Phiếu này đã đóng nên Claude không nhận yêu cầu ở đây. Muốn sửa video này: bấm nút Reopen issue (mở lại phiếu) ở cuối trang, rồi viết lại yêu cầu trong một bình luận mới."

  # 3) A pushed story (or a manual run) → pictures, or the voice and the video
  plan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      items: ${{ steps.plan.outputs.items }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose what to make
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          STORY: ${{ inputs.story }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A push makes every story file it adds, changes or renames (one job each); a push that only
          # deletes stories makes nothing; a push that changes code also runs the offline check (stills and a
          # short encode of the sample), next to the stories of the same push.
          if [[ "$EVENT_NAME" == "push" ]]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE=HEAD~1
            git -c core.quotePath=false diff -z --name-only --no-renames --diff-filter=AM "$BEFORE" HEAD -- 'stories/*.json' > /tmp/stories
            git -c core.quotePath=false diff -z --name-only --no-renames "$BEFORE" HEAD -- . ':!stories' > /tmp/code
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          stories = [name.removeprefix("stories/").removesuffix(".json")
                     for name in open("/tmp/stories", encoding="utf-8").read().split("\0") if name]
          code = [name for name in open("/tmp/code", encoding="utf-8").read().split("\0") if name]
          items = [{"mode": "story", "story": story} for story in stories]
          if code:
              items.append({"mode": "check", "story": "mau-boj"})
          print("items=" + json.dumps(items, ensure_ascii=False))
          PY
          else
            python3 -c 'import json, os; print("items=" + json.dumps([{"mode": os.environ["MODE"], "story": os.environ["STORY"]}], ensure_ascii=False))' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  video:
    needs: plan
    if: needs.plan.outputs.items != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.items) }}
    name: ${{ matrix.mode }} ${{ matrix.story }}
    concurrency:
      group: jnews-${{ matrix.mode }}-${{ matrix.story }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check the story
        id: plan
        env:
          MODE: ${{ matrix.mode }}
          STORY: ${{ matrix.story }}
        run: |
          STAGE=
          if [[ "$MODE" == "story" && -f "stories/$STORY.json" ]]; then
            # The issue this story belongs to, read first so that a story with problems reports to its issue.
            # A file that is not valid JSON is searched for its "issue": N as text; if that is not found
            # either, the failure shows only in this run (red) and the issue keeps its label.
            ISSUE=$(python tools/story_issue.py "stories/$STORY.json")
            echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"
          fi
          if [[ "$MODE" == "story" ]]; then
            if [[ ! "$STORY" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Story file name 'stories/$STORY.json': use only ASCII letters, digits, '.', '_' and '-' (no spaces, no Japanese or Vietnamese characters)"; exit 1
            fi
            [[ -f "stories/$STORY.json" ]] || { echo "::error::stories/$STORY.json not found"; exit 1; }
            python -m pip install -q -r requirements.txt
            python -m news.custom "stories/$STORY.json" || {
              echo "WHY=file kịch bản stories/$STORY.json có lỗi (sai cú pháp hoặc thiếu mục)" >> "$GITHUB_ENV"
              echo "::error::stories/$STORY.json has problems (listed above): fix the story file and push again"; exit 1; }
            STAGE=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('stage', 'find'))" "stories/$STORY.json")
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE story=$STORY stage=$STAGE"
      - name: Install video dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Get the pictures already found for the story
        if: matrix.mode == 'story' || matrix.mode == 'check'
        env:
          STORY: ${{ matrix.story }}
        run: |
          # The renders branch must be read (3 tries): with an empty folder the picture search would start
          # again from nothing and the pictures already chosen ("k-n") could become other pictures.
          set -o pipefail
          mkdir -p pictures
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          GOT=
          for attempt in 1 2 3; do
            status=0; git ls-remote --exit-code --heads "$URL" renders > /dev/null || status=$?
            if [[ $status == 2 ]]; then GOT=none; break; fi   # no renders branch yet (very first video)
            if [[ $status == 0 ]] && git fetch -q --depth 1 "$URL" "+refs/heads/renders:refs/remotes/origin/renders"; then GOT=yes; break; fi
            echo "could not read the renders branch (attempt $attempt)"
            [[ $attempt == 3 ]] || sleep $((attempt * 10))
          done
          if [[ -z "$GOT" ]]; then
            echo "WHY=không đọc được nhánh renders trên GitHub (lỗi mạng tạm thời), chạy lại là được" >> "$GITHUB_ENV"
            echo "::error::Could not fetch the renders branch after 3 attempts"; exit 1
          fi
          if [[ $GOT == yes ]] && git cat-file -e "origin/renders:$STORY/find" 2>/dev/null; then
            git archive origin/renders "$STORY/find" | tar -x --strip-components=2 -C pictures
          fi
          ls pictures | head -50 || true
      - name: Offline check (code push)
        if: matrix.mode == 'check'
        run: |
          # No live sources and no voice engine: compile, check every story, draw the stills of the sample.
          python -m compileall -q news
          for story in stories/*.json; do python -m news.custom "$story"; done
          [[ -f pictures/index.json ]] || { echo "::error::renders/mau-boj/find is missing: the sample stills need its pictures"; exit 1; }
          python -m news.custom stories/mau-boj.json pictures
          python -m news --story stories/mau-boj.json --pictures pictures --stills dist/stills
          # 3 seconds of real video in both frames (no voice engine: silence), so a fault in the encoder shows here
          python tools/encode_test.py stories/mau-boj.json pictures "$RUNNER_TEMP/encode-test"
          echo "Kiểm tra mã: OK (ảnh tĩnh của stories/mau-boj.json trong Artifacts; dựng thử 3 giây video)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the check stills
        if: matrix.mode == 'check'
        uses: actions/upload-artifact@v4
        with:
          name: japan-news-check-${{ github.run_number }}
          path: dist/stills/
          if-no-files-found: error
          retention-days: 7
      - name: 'Phiếu: đang tìm ảnh'
        if: steps.plan.outputs.stage == 'find' && env.ISSUE != ''
        run: |
          gh issue edit "$ISSUE" --add-label jnews-find || true
          # back to picture search from any step (also from check/done after a fix): only jnews-find stays
          for l in jnews-plan jnews-pick jnews-render jnews-check jnews-done jnews-fix jnews-failed; do gh issue edit "$ISSUE" --remove-label "$l" || true; done
      - name: Find pictures
        id: find
        if: steps.plan.outputs.stage == 'find'
        env:
          STORY: ${{ matrix.story }}
        run: |
          # Exit 3 = some searches failed: what was found is still published (status.json: "partial"),
          # then the run is marked failed. Any other error publishes nothing.
          set +e
          python -m news.find "stories/$STORY.json" pictures
          status=$?
          set -e
          if [[ $status != 0 && $status != 3 ]]; then exit $status; fi
          OUTCOME=ok; [[ $status == 3 ]] && OUTCOME=partial
          OUTCOME=$OUTCOME tools/publish.sh "$STORY/find" pictures find
          echo "Đã tìm ảnh cho \`$STORY\` ($OUTCOME): nhánh renders, thư mục \`$STORY/find\`." >> "$GITHUB_STEP_SUMMARY"
          if [[ $status == 3 ]]; then echo "::error::Some searches failed; see \"error\" in $STORY/find/index.json"; exit 1; fi
      - name: 'Phiếu: ảnh đã tìm xong'
        if: steps.find.outcome == 'success' && env.ISSUE != ''
        env:
          STORY: ${{ matrix.story }}
        run: |
          gh issue edit "$ISSUE" --add-label jnews-pick || true
          gh issue edit "$ISSUE" --remove-label jnews-find || true
          COUNT=$(python -c "import json; print(sum(len(q.get('results', [])) for q in json.load(open('pictures/index.json', encoding='utf-8'))))" 2>/dev/null || echo "?")
          gh issue comment "$ISSUE" --body "🤖 Ảnh đã tìm xong ($COUNT ảnh). Claude sẽ chọn ảnh cho từng cảnh." || true
          bash tools/wake_claude.sh "Phiếu tin Nhật số $ISSUE: ảnh đã tìm xong, chờ chọn ảnh." "$ISSUE" || true
      - name: 'Phiếu: đang dựng video'
        if: steps.plan.outputs.stage == 'render' && env.ISSUE != ''
        run: |
          gh issue edit "$ISSUE" --add-label jnews-render || true
          for l in jnews-plan jnews-find jnews-pick jnews-check jnews-done jnews-fix jnews-failed; do gh issue edit "$ISSUE" --remove-label "$l" || true; done
      - name: Start Japanese voice engine
        if: steps.plan.outputs.stage == 'render' || matrix.mode == 'demo' || matrix.mode == 'source' || matrix.mode == 'daily'
        run: |
          docker run --detach --name voicevox --publish 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 4 http://127.0.0.1:50021/version; then
              exit 0
            fi
            sleep 3
          done
          docker logs voicevox
          exit 1
      - name: Voice and render
        id: render
        if: steps.plan.outputs.stage == 'render' || matrix.mode == 'demo' || matrix.mode == 'source' || matrix.mode == 'daily'
        env:
          MODE: ${{ matrix.mode }}
          STORY: ${{ matrix.story }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          if [[ "$MODE" == "story" ]]; then
            python -m news --story "stories/$STORY.json" --pictures pictures --stills dist/stills
            python -m news --story "stories/$STORY.json" --pictures pictures
          elif [[ "$MODE" == "demo" ]]; then
            python -m news --demo
          elif [[ "$MODE" == "source" ]]; then
            : "${SOURCE_URL:?Enter an official release URL}"
            python -m news --url "$SOURCE_URL"
          else
            python -m news
          fi
      - name: Verify video and audio
        if: steps.render.outputs.ready == 'true'
        env:
          MODE: ${{ matrix.mode }}
        run: |
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate:format=duration -of json dist/video.mp4 > /tmp/japan-news-probe.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          probe = json.loads(Path('/tmp/japan-news-probe.json').read_text())
          video = next(stream for stream in probe['streams'] if stream['codec_type'] == 'video')
          audio = next(stream for stream in probe['streams'] if stream['codec_type'] == 'audio')
          assert (video['width'], video['height'], video['r_frame_rate'], video['codec_name']) == (1080, 1920, '30/1', 'h264')
          assert audio['codec_name'] == 'aac'
          limit = 600 if os.environ['MODE'] == 'story' else 91
          assert 10 < float(probe['format']['duration']) <= limit
          print(probe)
          # GitHub refuses a file over 100 MB on the renders branch (news/render.py aims at 88 MB at most)
          size = Path('dist/video.mp4').stat().st_size / 1e6
          print(f'video.mp4: {size:.1f} MB')
          if size > 98:
              why = f'video nặng {size:.0f} MB, quá giới hạn 100 MB của GitHub nên không đăng lên được'
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write(f'WHY={why}\n')
              raise SystemExit(f'::error::{why} (video.mp4 is too large to publish)')
          PY
      - name: Publish the story video
        if: steps.render.outputs.ready == 'true' && matrix.mode == 'story'
        env:
          STORY: ${{ matrix.story }}
        run: |
          # Replaces renders/<story>/ as a whole (old video, stills, subtitles), keeping the pictures in find/.
          python tools/credits.py dist/sources.json dist/credits.txt
          tools/publish.sh "$STORY" dist render find
          echo "Video: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/renders/$STORY/video.mp4" >> "$GITHUB_STEP_SUMMARY"
      - name: 'Phiếu: video đã dựng'
        if: steps.render.outputs.ready == 'true' && matrix.mode == 'story' && env.ISSUE != ''
        env:
          STORY: ${{ matrix.story }}
        run: |
          gh issue edit "$ISSUE" --add-label jnews-check || true
          gh issue edit "$ISSUE" --remove-label jnews-render || true
          LEN=$(python -c "import json; d = round(json.load(open('dist/sources.json', encoding='utf-8'))['duration_seconds']); print(f'{d // 60} phút {d % 60:02d} giây')" 2>/dev/null || echo "?")
          B="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/renders/$STORY"
          gh issue comment "$ISSUE" --body "🤖 Đã dựng xong bản video ($LEN). Claude đang kiểm tra lại từng cảnh trước khi giao.

          - Video: $B/video.mp4
          - Ảnh các cảnh: $B/stills/sheet.jpg" || true
          bash tools/wake_claude.sh "Phiếu tin Nhật số $ISSUE: video đã dựng, chờ kiểm tra." "$ISSUE" || true
      - name: Upload the video and sources
        if: steps.render.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: japan-news-video-${{ github.run_number }}-${{ strategy.job-index }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: 'Phiếu: báo lỗi'
        # any failure or cancel of a story run is reported on its issue, so it never waits silently
        if: (failure() || cancelled()) && env.ISSUE != ''
        env:
          STORY: ${{ matrix.story }}
        run: |
          gh issue edit "$ISSUE" --add-label jnews-failed || true
          for l in jnews-find jnews-render; do gh issue edit "$ISSUE" --remove-label "$l" || true; done
          gh issue comment "$ISSUE" --body "🤖 Máy gặp lỗi khi làm \`$STORY\`${WHY:+: $WHY} — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Claude sẽ xem và sửa." || true
          bash tools/wake_claude.sh "Phiếu tin Nhật số $ISSUE bị lỗi." "$ISSUE" || true
