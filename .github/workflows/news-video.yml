name: Japan News Video

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily: tin mới / demo: video mẫu / source: thông cáo theo URL'
        type: choice
        options: [daily, demo, source]
        default: daily
      source_url:
        description: 'Link thông cáo HTML của BOJ, METI hoặc trang CPI toàn quốc'
        type: string
  push:
    branches: [main]
    paths:
      - 'news/**'
      - 'requirements.txt'
      - '.github/workflows/news-video.yml'

permissions:
  contents: read

concurrency:
  group: japan-news-video-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install video dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Check scheduled news selection
        if: github.event_name == 'push'
        run: python -m news --previous-day-only --plan-only
      - name: Start Japanese voice engine
        run: |
          docker run --detach --name voicevox --publish 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 4 http://127.0.0.1:50021/version; then
              exit 0
            fi
            sleep 3
          done
          docker logs voicevox
          exit 1
      - name: Find news, voice, and render
        id: render
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_URL: ${{ inputs.source_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$MODE" == "demo" ]]; then
            python -m news --demo
          elif [[ "$MODE" == "source" ]]; then
            : "${SOURCE_URL:?Enter an official release URL}"
            python -m news --url "$SOURCE_URL"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            python -m news --previous-day-only
          else
            python -m news
          fi
      - name: Verify video and audio
        if: steps.render.outputs.ready == 'true'
        run: |
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate:format=duration -of json dist/video.mp4 > /tmp/japan-news-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path('/tmp/japan-news-probe.json').read_text())
          video = next(stream for stream in probe['streams'] if stream['codec_type'] == 'video')
          audio = next(stream for stream in probe['streams'] if stream['codec_type'] == 'audio')
          assert (video['width'], video['height'], video['r_frame_rate'], video['codec_name']) == (1080, 1920, '30/1', 'h264')
          assert audio['codec_name'] == 'aac'
          assert 10 < float(probe['format']['duration']) <= 91
          print(probe)
          PY
      - name: Upload the video and sources
        if: steps.render.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: japan-news-video-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
