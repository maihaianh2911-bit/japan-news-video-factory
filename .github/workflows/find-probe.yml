name: find-probe

# TEMPORARY, on the work branch only (never on main): tries the wider picture search on a GitHub runner, where the
# search really runs (Claude's cloud session cannot reach most picture sites). Reads nothing secret, writes nothing.
on:
  push:
    branches: ['claude/festive-bell-uub2a8']
    paths: ['.github/probe/**', '.github/workflows/find-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - run: python .github/probe/probe.py
