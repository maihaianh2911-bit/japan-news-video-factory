# Temporary test (18/11/2026): can GitHub's machine find and download short news videos (yt-dlp)?
# Runs only on Claude's working branch; removed after the test.
name: video-probe
on:
  push:
    branches: [ccr-c2228975-po4f1o]
    paths: ['.github/workflows/video-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          pip install -q -U "yt-dlp[default]"
          command -v ffmpeg || (timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null) || true
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: YouTube with other players
        run: |
          deno --version | head -1 || true
          for client in default tv tv_embedded web_embedded mweb android_vr ios web_safari; do
            echo "=== player $client"
            timeout 120 yt-dlp --extractor-args "youtube:player_client=$client" -f "bv*[height<=1080]" --download-sections "*20-30" \
              -o "yt-$client.%(ext)s" "https://www.youtube.com/watch?v=FQDndtYM2jY" 2>&1 | grep -E "ERROR|Destination|100%" | tail -2 || true
          done
          ls -la yt-* 2>/dev/null || echo "no youtube file"
      - name: Yahoo! News Japan
        shell: python
        run: |
          import re, subprocess, urllib.parse, urllib.request
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          links = []
          for q in ["愛子さま シンガポール", "愛子さま 羽田 シンガポール 出発", "愛子さま シンガポール 到着"]:
              for url in ["https://news.yahoo.co.jp/search?" + urllib.parse.urlencode({"p": q, "ei": "utf-8"}),
                          "https://news.yahoo.co.jp/search?" + urllib.parse.urlencode({"p": q + " 動画", "ei": "utf-8"})]:
                  try:
                      page = urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=30).read().decode("utf-8", "replace")
                  except Exception as e:
                      print("search failed", e); continue
                  for link in re.findall(r'https://news\.yahoo\.co\.jp/(?:articles|pickup)/[0-9a-zA-Z]+', page):
                      if link not in links:
                          links.append(link)
          print(len(links), "articles")
          for link in links[:25]:
              r = subprocess.run(["yt-dlp", "--simulate", "--no-warnings", "--print", "%(extractor)s | %(duration)s s | %(height)sp | %(title)s", link],
                                 capture_output=True, text=True, timeout=120)
              out = r.stdout.strip() or (r.stderr.strip().splitlines() or ["?"])[-1]
              print("TRY", link, "->", out[:220])
      - name: Download one Yahoo video
        run: |
          echo "(done in the next test if the step above finds one)"
      - name: TikTok
        run: |
          timeout 90 yt-dlp --simulate --no-warnings --print "%(extractor)s | %(duration)s | %(height)sp | %(title)s" "https://www.tiktok.com/@amorleonorysofia/video/7701131986601086215" 2>&1 | tail -2 || true
