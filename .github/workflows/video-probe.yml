# Temporary test (18/11/2026): can GitHub's machine find and download short news videos (yt-dlp)?
# Runs only on Claude's working branch; removed after the test.
name: video-probe
on:
  push:
    branches: [ccr-c2228975-po4f1o]
    paths: ['.github/workflows/video-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q -U "yt-dlp[default]"
          command -v ffmpeg || (timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null) || true
      - name: Find TikTok and news-site videos with Bing, download the TikTok ones
        shell: python
        run: |
          import json, re, subprocess, urllib.parse, urllib.request, html, os
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept-Language": "ja,en;q=0.8"}
          def bing(q, kind="search"):
              url = f"https://www.bing.com/{kind}?" + urllib.parse.urlencode({"q": q, "count": 50})
              try:
                  return html.unescape(urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=30).read().decode("utf-8", "replace"))
              except Exception as e:
                  print("bing failed", q, e); return ""
          tiktok, news = [], []
          for q in ["愛子さま シンガポール", "愛子さま シンガポール 羽田", "愛子さま シンガポール 到着", "愛子さま シンガポール 花束", "愛子さま ラベンダー スーツ", "Princess Aiko Singapore"]:
              for kind in ("search", "videos/search"):
                  page = bing("site:tiktok.com " + q, kind)
                  for link in re.findall(r'https://www\.tiktok\.com/@[\w.\-]+/video/\d+', page):
                      if link not in tiktok: tiktok.append(link)
          for site in ["newsdig.tbs.co.jp", "news.ntv.co.jp", "www.fnn.jp", "news.tv-asahi.co.jp", "www3.nhk.or.jp", "www.kunaicho.go.jp"]:
              page = bing(f"site:{site} 愛子さま シンガポール")
              for link in re.findall(r'https?://' + re.escape(site) + r'/[^"\s<>]+', page):
                  link = link.split("&")[0]
                  if link not in news: news.append(link)
          print(len(tiktok), "tiktok;", len(news), "news pages")
          for link in news[:24]:
              r = subprocess.run(["yt-dlp", "--simulate", "--no-warnings", "--print", "%(extractor)s | %(duration)s s | %(height)sp | %(title)s", link], capture_output=True, text=True, timeout=120)
              print("NEWS", link, "->", (r.stdout.strip() or (r.stderr.strip().splitlines() or ["?"])[-1])[:200])
          os.makedirs("probe", exist_ok=True)
          found = []
          for link in tiktok[:40]:
              r = subprocess.run(["yt-dlp", "-J", "--no-warnings", link], capture_output=True, text=True, timeout=120)
              if r.returncode: print("TT fail", link, (r.stderr.strip().splitlines() or ["?"])[-1][:150]); continue
              info = json.loads(r.stdout)
              found.append({"url": link, "id": info.get("id"), "uploader": info.get("uploader"), "duration": info.get("duration"),
                            "width": info.get("width"), "height": info.get("height"), "date": info.get("upload_date"),
                            "title": (info.get("title") or info.get("description") or "")[:150]})
              print("TT", found[-1])
          recent = [f for f in found if (f["date"] or "") >= "20261116"]
          print(len(found), "tiktok readable,", len(recent), "posted since 16/11")
          for f in recent[:20]:
              subprocess.run(["yt-dlp", "-q", "--no-warnings", "-f", "b[ext=mp4]/b", "-o", f"probe/tt-{f['id']}.%(ext)s", f["url"]], timeout=180)
          json.dump(found, open("probe/tiktok.json", "w"), ensure_ascii=False, indent=1)
      - name: Keep the results on this branch
        run: |
          ls -la probe; du -sh probe
          find probe -name '*.mp4' -size +40M -delete
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe: tiktok videos (temporary)" && git push -q origin HEAD:ccr-c2228975-po4f1o || echo "nothing to push"
